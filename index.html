<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f14">

    <title>CRAQUE!!!</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0f14;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* CABEÇALHO */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .version {
            color: #7d8794;
            font-size: 12px;
        }

        /* TELA INICIAL */

        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .ball {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(48px, 12vw, 90px);
            font-weight: 900;
            letter-spacing: -5px;
            line-height: 0.9;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 500px;
            color: #9ba5b1;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 45px;
        }

        /* MENU */

        .menu {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-button {
            width: 100%;
            min-height: 58px;
            border: 1px solid #252d37;
            border-radius: 10px;
            background: #131920;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .menu-button:hover {
            background: #1b232d;
            border-color: #3b4653;
            transform: translateY(-1px);
        }

        .menu-button.primary {
            background: #ffffff;
            color: #0b0f14;
            border-color: #ffffff;
        }

        .menu-button.primary:hover {
            background: #e7e7e7;
        }

        /* RODAPÉ */

        footer {
            text-align: center;
            padding: 30px 0 10px;
            color: #59636f;
            font-size: 12px;
        }

        /* CELULAR */

        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }

            header {
                padding-bottom: 10px;
            }

            .logo {
                font-size: 25px;
            }

            .hero {
                min-height: 75vh;
            }

            .hero h1 {
                letter-spacing: -3px;
            }

            .hero p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">CRAQUE!!!</div>
            <div class="version">ALPHA 0.1</div>
        </header>

        <main class="hero">

            <div class="ball">⚽</div>

            <h1>CRAQUE!!!</h1>

            <p>
                Construa sua carreira, tome suas decisões
                e escreva sua própria história no futebol.
            </p>

            <div class="menu">

                <button class="menu-button primary">
                    NOVO JOGO
                </button>

                <button class="menu-button">
                    CONTINUAR
                </button>

                <button class="menu-button">
                    CONFIGURAÇÕES
                </button>

            </div>

        </main>

        <footer>
            CRAQUE!!! · Projeto em desenvolvimento
        </footer>

    </div>
<script src="js/app.js"></script>
</body>
</html>
